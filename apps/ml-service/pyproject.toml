[project]
name = "dubsibhai-ml-service"
version = "0.1.0"
description = "DubsiBhai FastAPI ML microservice"
requires-python = ">=3.11"
dependencies = ["fastapi[standard]", "pydantic-settings"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
