[project]
name = "dubsibhai-ml-service"
version = "0.1.0"
description = "DubsiBhai FastAPI ML microservice"
requires-python = ">=3.11"
dependencies = ["fastapi[standard]", "pydantic-settings", "scikit-learn>=1.5,<2", "joblib>=1.4,<2"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11"]
notebooks = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
