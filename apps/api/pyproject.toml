[project]
name = "dubsibhai-api"
version = "0.1.0"
description = "DubsiBhai core FastAPI application"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]", "pydantic-settings", "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "redis>=5,<7",
    "argon2-cffi>=23", "google-auth[requests]>=2.38,<3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11", "fakeredis[lua]>=2.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
