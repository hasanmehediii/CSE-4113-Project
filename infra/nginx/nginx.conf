events {}

http {
    # Docker DNS re-resolves the API after container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Defense at the edge; Redis enforces account and IP buckets across API workers.
    limit_req_zone $binary_remote_addr zone=auth_edge:10m rate=5r/s;
    limit_req_status 429;

    server {
        listen 8080;
        server_tokens off;
        client_max_body_size 1m;
        set $api_upstream api:8000;

        location /api/v1/auth/ {
            limit_req zone=auth_edge burst=20;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            # Overwrite untrusted incoming forwarding headers; API trusts this hop only.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /api/ {
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://$api_upstream;
        }

        location / {
            return 404;
        }
    }
}
