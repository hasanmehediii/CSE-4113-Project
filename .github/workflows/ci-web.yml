name: Web CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes pnpm@10.34.5 install --frozen-lockfile
      - run: npx --yes pnpm@10.34.5 typecheck
      - run: npx --yes pnpm@10.34.5 test
      - run: npx --yes pnpm@10.34.5 lint
      - run: npx --yes pnpm@10.34.5 build
