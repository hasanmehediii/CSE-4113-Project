name: API CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dubsibhai
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dubsibhai -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.11.24
      - run: uv sync --locked
      - run: uv run ruff check app tests
      # Start MongoDB in a step so failures include its logs instead of aborting
      # during GitHub's service initialization before checkout and diagnostics.
      - name: Start MongoDB and wait for readiness
        timeout-minutes: 3
        run: |
          # Let glibc register rseq so TCMalloc uses per-thread caches on newer
          # runner kernels: https://jira.mongodb.org/browse/SERVER-136848
          docker run --detach --name api-ci-mongodb \
            --env GLIBC_TUNABLES=glibc.pthread.rseq=1 \
            --publish 127.0.0.1:27017:27017 mongo:8.0.34
          for attempt in {1..30}; do
            if docker exec api-ci-mongodb mongosh --quiet \
              --eval 'quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)'; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' api-ci-mongodb)" != "true" ]; then
              echo "::error::MongoDB exited before becoming ready"
              exit 1
            fi
            sleep 2
          done
          echo "::error::MongoDB did not become ready within 60 seconds"
          exit 1
      - run: uv run pytest -q
        env:
          RUN_POSTGRES_TESTS: "1"
          TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://dubsibhai:local-dev-only@127.0.0.1:5432/postgres
          TEST_MONGODB_URL: mongodb://127.0.0.1:27017
      - name: MongoDB failure diagnostics
        if: failure()
        run: |
          docker inspect --format '::notice title=MongoDB container state::exit={{.State.ExitCode}}; error={{.State.Error}}; oom={{.State.OOMKilled}}' api-ci-mongodb || true
          docker logs --tail 30 api-ci-mongodb 2>&1 |
            sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/^/::notice title=MongoDB startup log::/' || true
      - name: Remove CI MongoDB container
        if: always()
        run: docker rm --force api-ci-mongodb > /dev/null 2>&1 || true
